name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Core & Ml – Build + Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: |
          dotnet build src/NightDog.Core -c Release -warnaserror
          dotnet build src/NightDog.Ml -c Release -warnaserror

      - name: Test
        run: dotnet test tests/NightDog.Core.Tests -c Release --logger "trx;LogFileName=results.trx"

      - name: Testergebnisse hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/**/TestResults/*.trx

  android:
    name: Android – Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'

      - name: MAUI-Android-Workload installieren
        run: dotnet workload install maui-android

      - name: Android-Abhängigkeiten installieren
        run: >
          dotnet build src/NightDog.App -t:InstallAndroidDependencies -f net10.0-android
          -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" -p:AcceptAndroidSDKLicenses=True

      - name: APK bauen
        run: >
          dotnet publish src/NightDog.App -c Release -f net10.0-android
          -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME"
          -p:AndroidPackageFormats=apk -o artifacts/android

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: nightdog-android
          path: artifacts/android/*-Signed.apk
